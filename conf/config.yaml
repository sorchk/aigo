api_token: ""
onnxruntime_lib: "/home/sorc/.pyenv/versions/3.12.0/lib/python3.12/site-packages/onnxruntime/capi/libonnxruntime.so.1.24.4"
llama_server_path: ""

logging:
  enabled: true
  path: "logs/requests.log"
  max_size_mb: 100
  max_backups: 7
  max_age_days: 30
  compress: true
  sanitize: true
  # llama-server 子进程日志去向：
  #   file    = 写入独立轮转文件 <llama_server_log_dir>/llama-server-<模型名>.log（默认）
  #   stdout  = 继承父进程 stdout/stderr（systemd 下会被收进 journald）
  #   discard = 直接丢弃
  # 子进程的日志与业务请求无关，走独立文件可以避免把系统日志盘写满。
  llama_server_log: "file"
  llama_server_log_dir: "logs"

models:
  - name: bge-reranker-v2-m3
    type: rerank
    runtime: llama
    gguf_file: "/datadisk/models/hf/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf"
    n_gpu_layers: 99
    # 每个 (query, document) 对必须落在同一个 ubatch 内，否则报
    # "input (N tokens) is too large to process. increase the physical batch size"
    # llama-server 默认 n_ubatch=512，模型自身支持 8192
    n_ctx: 8192
    n_batch: 8192
    n_ubatch: 8192
    # 并发 slot 数（llama-server -np）；0 = 不设置，沿用服务端自动值(4)。
    n_parallel: 4
    # 统一 KV 池（--kv-unified / --no-kv-unified）：
    #   true  = 所有 slot 共享同一个 KV 池，每个 slot 的上下文仍是 n_ctx(8192)
    #   false = 每个 slot 各持 n_ctx / n_parallel = 2048 的上下文
    # 不填 = 不传该开关，由服务端默认值决定（上游默认：slot 数自动时开启统一 KV）
    kv_unified: true
    auto_load: true
    enabled: false

  - name: bge-reranker-v2-m3
    type: rerank
    runtime: onnx
    model_path: "/datadisk/models/hf/onnx-community/bge-reranker-v2-m3-ONNX"
    onnx_subdir: "onnx_int8"
    auto_load: true
    enabled: false

  - name: bge-m3
    type: embedding
    runtime: llama
    gguf_file: "/datadisk/models/hf/gpustack/bge-m3-GGUF/bge-m3-Q8_0.gguf"
    n_gpu_layers: 99
    # 单次请求的最大 token 数 = min(n_ubatch, n_ctx)，llama-server 默认 n_ubatch=512
    n_ctx: 8192
    n_batch: 8192
    n_ubatch: 8192
    # 并发 slot 数（llama-server -np）；0 = 不设置，沿用服务端自动值(4)。
    n_parallel: 4
    # 统一 KV 池（--kv-unified / --no-kv-unified），说明见上方同名模型
    kv_unified: true
    # llama-server 日志级别：0=generic 1=error 2=warning 3=info 4=trace 5=debug
    # 4(TRACE) 会把整个 prompt 缓存逐条打印出来，与业务流量无关，几分钟就能写出上百 MB。
    log_verbosity: 3
    # 空闲 slot 是否写入 prompt 缓存。统一 KV 池下服务端本来就会清理空闲 slot，
    # 关掉可以避免缓存条目只增不减（条目占用记为 0，--cache-ram 的淘汰上限永远触发不了）。
    cache_idle_slots: false
    auto_load: true
    enabled: true

  - name: bge-m3
    type: embedding
    runtime: onnx
    model_path: "/datadisk/models/hf/BAAI/bge-m3/onnx"
    onnx_subdir: ""
    onnx_output_name: "token_embeddings"
    onnx_hidden_size: 1024
    auto_load: true
    enabled: true

  - name: qwen3.5
    type: llm
    runtime: llama
    gguf_file: "/datadisk/models/hf/unsloth/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q8_0.gguf"
    mmproj_file: "/datadisk/models/hf/unsloth/Qwen3.5-9B-GGUF/mmproj-F16.gguf"
    # chat_template_file: "/datadisk/models/hf/jinja/qwen3.5-9b-opus.jinja"
    chat_template_file: "/datadisk/models/hf/jinja/qwen3.5-instruct.jinja"
    n_gpu_layers: 99
    # chat_template_kwargs: 
    #   enable_thinking: false
    n_ctx: 65536
    jinja: true
    presence_penalty: 0.0
    temperature: 0.6
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    # 并发 slot 数（llama-server -np）；不设置 = 服务端自动值(4)。
    # n_parallel: 4
    # 统一 KV 池（--kv-unified / --no-kv-unified）；不设置 = 服务端默认。
    #   true  = 所有 slot 共享一个 KV 池，单请求可用满 n_ctx，但并发总 token 受 n_ctx 限制
    #   false = 每个 slot 各持 n_ctx / n_parallel 的上下文，互相隔离
    # kv_unified: true
    # llama-server 日志级别：0=generic 1=error 2=warning 3=info 4=trace 5=debug
    # 4(TRACE) 会把整个 prompt 缓存逐条打印出来，与业务流量无关，几分钟就能写出上百 MB。
    log_verbosity: 3
    # 空闲 slot 是否写入 prompt 缓存。统一 KV 池下服务端本来就会清理空闲 slot，
    # 关掉可以避免缓存条目只增不减（条目占用记为 0，--cache-ram 的淘汰上限永远触发不了）。
    cache_idle_slots: false
    # 额外透传给 llama-server 的参数（原样拼接在内置参数之后）
    # extra_args:
    #   - "--flash-attn"
    #   - "--cache-type-k"
    #   - "q8_0"
    #   - "--cache-type-v"
    #   - "q8_0"
    #   - "--no-context-shift"
    auto_load: true
    enabled: true

  - name: copaw-4b
    type: llm
    runtime: llama
    gguf_file: "/datadisk/models/hf/agentscope-ai/CoPaw-Flash-4B-Q4_K_M/CoPaw-flash-4B-20260330-q4.gguf"
    n_gpu_layers: 99
    n_ctx: 131072
    auto_load: true
    enabled: false

  - name: qwen3.5-4b
    type: llm
    runtime: onnx
    model_path: "/datadisk/models/hf/onnx-community/Qwen3.5-4B-ONNX"
    onnx_subdir: "onnx_q4"
    auto_load: true
    enabled: false

  - name: gemma4-4b
    type: llm
    runtime: llama
    gguf_file: "/datadisk/models/hf/unsloth/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q4_K_M.gguf"
    mmproj_file: "/datadisk/models/hf/unsloth/gemma-4-E4B-it-GGUF/mmproj-F16.gguf"
    n_gpu_layers: 99
    n_ctx: 131072
    auto_load: true
    enabled: false
